[package]
name = "rest-types"
version = "2.6.4"
edition = "2021"
resolver = "2"

[features]
#default = ["service-impl"]
default = []
service-impl = ["dep:service", "dep:shifty-utils", "dep:dao"]

[dependencies.service]
path = "../service"
optional = true

# Phase 55 (55-03): Rebooking-Batch-Entity/-State stammen aus dem `dao`-Crate;
# die From-Mappings in `rebooking.rs` referenzieren sie direkt. Nur unter
# `service-impl` aktiv, damit das reine Wire-Crate schlank bleibt.
[dependencies.dao]
path = "../dao"
optional = true

[dependencies.shifty-utils]
path = "../shifty-utils"
optional = true

[dependencies.serde]
version = "1.0.198"
features = ["derive", "std", "alloc", "rc"]

[dependencies.uuid]
version = "1.8.0"
features = ["v4", "serde"]

[dependencies.time]
version = "0.3.36"
features = ["serde-human-readable"]

[dependencies.utoipa]
version = "5"
features = ["time", "rc_schema", "uuid"]


[dev-dependencies.serde_json]
version = "1.0.145"


[lints.rust]
warnings = "deny"

[lints.clippy]
all = "deny"
